[project]
name = "vmlab-api"
version = "0.1.0"
description = "VMlab Phase 1 — retail display analysis API"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "langgraph>=1.0",
    "python-multipart>=0.0.12",
    "pillow>=11.0",
    "pypdf>=5.0",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
